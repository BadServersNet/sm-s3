name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Format check and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check formatting and lint
        run: scripts/lint.sh

  plugin:
    name: Compile example plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SourceMod
        run: |
          version="$(curl -fsSL https://sm.alliedmods.net/smdrop/1.12/sourcemod-latest-linux)"
          mkdir sourcemod
          curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/${version}" | tar -xz -C sourcemod

      - name: Compile
        run: >
          sourcemod/addons/sourcemod/scripting/spcomp64
          -E
          -i pawn/scripting/include
          -o s3-example.smx
          pawn/scripting/s3-example.sp

  build:
    name: Build (Linux x86, sniper)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/sniper-i386.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --install build --prefix build/package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-s3-linux
          path: build/package

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, plugin, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sm-s3-linux
          path: package

      - name: Zip
        run: |
          version="${GITHUB_REF#refs/tags/}"
          (cd package && zip -r "../sm-s3-${version}-linux.zip" .)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: sm-s3-*-linux.zip
